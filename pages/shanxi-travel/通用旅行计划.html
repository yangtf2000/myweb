<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行计划定制 — 通用版</title>
<style>
/* ========== Reset & Variables ========== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--bg2:#181b24;--bg3:#1e2230;--card:#1a1e2c;--card2:#222738;
  --text:#e0e0e0;--text2:#a0a8b8;--text3:#6b7280;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  /* POI 分类色 */
  --poi-scenic:#85B7EB;   /* 景点 - 蓝 */
  --poi-food:#FAC775;     /* 美食 - 琥珀 */
  --poi-culture:#AFA9EC;  /* 文化 - 紫 */
  --poi-shop:#5DCAA5;     /* 购物 - 青绿 */
  --poi-other:#e0e0e0;
  --radius:10px;--radius-lg:16px;
}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  line-height:1.6;font-size:15px;overflow-x:hidden;
}

/* ========== Top Banner ========== */
.top-banner{
  background:linear-gradient(135deg, #1a1e2c 0%, #1e2740 40%, #1a2040 100%);
  border-bottom:1px solid var(--border);position:relative;overflow:hidden;
}
.top-banner::before{
  content:'';position:absolute;top:-50%;right:-20%;
  width:500px;height:500px;
  background:radial-gradient(circle, rgba(133,183,235,0.08) 0%, transparent 70%);
  border-radius:50%;pointer-events:none;
}
.banner-inner{
  max-width:1280px;margin:0 auto;padding:32px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  flex-wrap:wrap;position:relative;z-index:1;
}
.banner-title h1{
  font-size:clamp(20px,3.5vw,32px);font-weight:700;color:#fff;
  letter-spacing:-0.5px;line-height:1.3;
}
.banner-title h1 span{color:var(--poi-scenic)}
.banner-title .sub{
  font-size:14px;color:var(--text2);margin-top:6px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.banner-badges{display:flex;gap:12px;flex-wrap:wrap}
.badge-item{
  background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);
  padding:12px 18px;text-align:center;min-width:70px;
}
.badge-item .val{font-size:20px;font-weight:700;color:#fff;line-height:1.2}
.badge-item .lbl{font-size:11px;color:var(--text3);margin-top:2px}

/* ========== Map + Cards Section ========== */
.content-section{max-width:1280px;margin:0 auto;padding:20px 24px;position:relative}

/* Day Tabs */
.day-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{
  flex-shrink:0;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;
  cursor:pointer;border:1px solid var(--border);background:var(--card);
  color:var(--text2);transition:all .2s;white-space:nowrap;
}
.day-tab:hover{border-color:var(--border2);color:var(--text)}
.day-tab.active{border-color:var(--poi-scenic);background:rgba(133,183,235,0.12);color:var(--poi-scenic)}

/* Main 2-col layout */
.main-grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;min-height:500px}
@media(max-width:820px){.main-grid{grid-template-columns:1fr}}

/* Left: Timeline Cards */
.timeline-panel{
  max-height:calc(100vh - 260px);overflow-y:auto;padding-right:4px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.timeline-panel::-webkit-scrollbar{width:4px}
.timeline-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.timeline-day-header{
  font-size:15px;font-weight:600;color:#fff;margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
}
.timeline-day-header .day-label{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;font-size:12px;font-weight:700;
  background:rgba(133,183,235,0.2);color:var(--poi-scenic);
}
.timeline-day-header .day-city{font-size:12px;color:var(--text3);font-weight:400}

.timeline-card{
  position:relative;padding:12px 14px 12px 36px;margin-bottom:10px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  cursor:pointer;transition:all .2s;
}
.timeline-card:hover{border-color:var(--border2);background:var(--card2)}
.timeline-card.active{border-color:var(--poi-scenic);box-shadow:0 0 0 1px rgba(133,183,235,0.2)}
.timeline-card .card-dot{
  position:absolute;left:10px;top:16px;width:10px;height:10px;border-radius:50%;
  border:2px solid transparent;
}
.timeline-card .card-dot.type-scenic{background:var(--poi-scenic);border-color:rgba(133,183,235,0.3)}
.timeline-card .card-dot.type-food{background:var(--poi-food);border-color:rgba(250,199,117,0.3)}
.timeline-card .card-dot.type-culture{background:var(--poi-culture);border-color:rgba(175,169,236,0.3)}
.timeline-card .card-dot.type-shop{background:var(--poi-shop);border-color:rgba(93,202,165,0.3)}
.timeline-card .card-dot.type-other{background:var(--poi-other);border-color:rgba(224,224,224,0.3)}

.timeline-card .card-time{font-size:11px;color:var(--text3);margin-bottom:2px}
.timeline-card .card-name{font-size:14px;font-weight:500;color:var(--text)}
.timeline-card .card-desc{font-size:12px;color:var(--text2);margin-top:2px}
.timeline-card .badge-type{
  display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;
  margin-top:4px;font-weight:500;
}
.badge-type.scenic{background:rgba(133,183,235,0.15);color:var(--poi-scenic)}
.badge-type.food{background:rgba(250,199,117,0.15);color:var(--poi-food)}
.badge-type.culture{background:rgba(175,169,236,0.15);color:var(--poi-culture)}
.badge-type.shop{background:rgba(93,202,165,0.15);color:var(--poi-shop)}

/* Timeline connector line */
.timeline-card::before{
  content:'';position:absolute;left:14px;top:30px;bottom:-13px;
  width:1px;background:var(--border);z-index:-1;
}
.timeline-card:last-child::before{display:none}

/* Right: Map */
.map-wrapper{position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);background:var(--bg2)}
.map-container{width:100%;height:100%;min-height:400px}
#mapContainer{width:100%;height:100%;min-height:500px}
.map-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg2);z-index:2}
.map-loading .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--poi-scenic);border-radius:50%;animation:spin .8s linear infinite}
.map-loading .text{font-size:13px;color:var(--text3);margin-top:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.map-legend{position:absolute;bottom:12px;left:12px;z-index:3;display:flex;flex-wrap:wrap;gap:8px}
.map-legend .legend-item{display:flex;align-items:center;gap:4px;font-size:11px;padding:4px 8px;background:rgba(15,17,23,.85);border-radius:6px;color:var(--text2);backdrop-filter:blur(8px)}
.map-legend .legend-dot{width:8px;height:8px;border-radius:50%}

/* ========== Data Configuration Panel ========== */
.config-toggle{
  position:fixed;right:20px;bottom:24px;z-index:50;
  width:48px;height:48px;border-radius:50%;
  background:var(--poi-scenic);border:none;color:#111;
  cursor:pointer;font-size:20px;box-shadow:0 4px 16px rgba(0,0,0,.4);
  transition:transform .2s;display:flex;align-items:center;justify-content:center;
}
.config-toggle:hover{transform:scale(1.05)}
.config-overlay{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(4px);
}
.config-overlay.open{display:flex}
.config-panel{
  background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);
  padding:24px;max-width:560px;width:90%;max-height:85vh;overflow-y:auto;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.config-panel h3{font-size:18px;margin-bottom:16px;color:#fff}
.config-panel label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px}
.config-panel input,.config-panel select{
  width:100%;padding:10px 12px;margin-bottom:14px;
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:14px;outline:none;
}
.config-panel input:focus,.config-panel select:focus{border-color:var(--poi-scenic)}
.config-panel .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.config-panel button{
  padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:500;
}
.config-panel .btn-primary{background:var(--poi-scenic);color:#111}
.config-panel .btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}

/* ========== Responsive ========== */
@media(max-width:820px){
  .banner-inner{flex-direction:column;text-align:center}
  .banner-badges{justify-content:center}
  .day-tabs{justify-content:flex-start}
  .main-grid{display:block}
  .timeline-panel{max-height:none;margin-bottom:16px}
  #mapContainer{min-height:350px;height:350px}
  .map-wrapper{position:sticky;top:0;z-index:10}
}
@media(max-width:480px){
  .banner-inner{padding:20px 14px}
  .banner-title h1{font-size:20px}
  .badge-item{padding:8px 14px}
  .badge-item .val{font-size:16px}
  .content-section{padding:12px}
  .day-tab{padding:6px 12px;font-size:12px}
}
</style>

/* ================================================================
   腾讯地图 JS API 动态加载模块
   复用自模板中的 loadTencentMap 逻辑
   ================================================================ */
const TENCENT_MAP_KEY = 'GPCBZ-3FKCD-4T44C-HBX6S-GQFFH-NBB4X';
const SCRIPT_ID = 'tencent-map-gl';

let _tmapLoadPromise = null;
function loadTencentMap(){
  if(window.TMap) return Promise.resolve(window.TMap);
  if(_tmapLoadPromise) return _tmapLoadPromise;
  _tmapLoadPromise = new Promise(function(resolve,reject){
    var exist = document.getElementById(SCRIPT_ID);
    if(exist){
      exist.addEventListener('load',function(){resolve(window.TMap)});
      exist.addEventListener('error',function(){reject(new Error('地图加载失败'))});
      return;
    }
    var s = document.createElement('script');
    s.id = SCRIPT_ID;
    s.src = 'https://map.qq.com/api/gljs?v=1.exp&key=' + TENCENT_MAP_KEY;
    s.async = true;
    s.onload = function(){ window.TMap ? resolve(window.TMap) : reject(new Error('TMap未加载')) };
    s.onerror = function(){ _tmapLoadPromise=null;reject(new Error('地图加载失败')) };
    document.head.appendChild(s);
  });
  return _tmapLoadPromise;
}

/* ================================================================
   Map State
   ================================================================ */
var mapInstance = null;
var markerLayer = null;
var polylineLayer = null;
var infoWindow = null;
var currentDay = 1;

/* ================================================================
   Render Timeline Cards
   ================================================================ */
function renderTimeline(dayIndex){
  var panel = document.getElementById('timelinePanel');
  var day = tripData.days[dayIndex];
  if(!day){
    panel.innerHTML = '<div style="color:var(--text3);padding:20px">暂无行程数据</div>';
    return;
  }
  var html = '<div class="timeline-day-header"><span class="day-label">D'+day.day+'</span>'+day.theme+'<span class="day-city">'+day.city+'</span></div>';
  day.pois.forEach(function(poi,idx){
    html += '<div class="timeline-card" data-poi-idx="'+idx+'" data-day="'+day.day+'" onclick="flyToPOI('+day.day+','+idx+')">';
    html += '<span class="card-dot type-'+poi.type+'"></span>';
    html += '<div class="card-time">'+poi.time+'</div>';
    html += '<div class="card-name">'+poi.name+'</div>';
    if(poi.desc) html += '<div class="card-desc">'+poi.desc+'</div>';
    html += '<span class="badge-type '+poi.type+'">'+getPOILabel(poi.type)+'</span>';
    html += '</div>';
  });
  panel.innerHTML = html;
  panel.scrollTop = 0;
}

/* ================================================================
   Render Day Tabs
   ================================================================ */
function renderDayTabs(activeDay){
  var tabs = document.getElementById('dayTabs');
  var html = '';
  tripData.days.forEach(function(d){
    html += '<div class="day-tab'+(d.day===activeDay?' active':'')+'" onclick="switchDay('+d.day+')">D'+d.day+' '+d.city+'</div>';
  });
  tabs.innerHTML = html;
}

/* ================================================================
   Fly to POI on Map
   ================================================================ */
function flyToPOI(dayNum, poiIdx){
  var dayData = tripData.days.find(function(d){ return d.day===dayNum });
  if(!dayData || !dayData.pois[poiIdx]) return;
  var poi = dayData.pois[poiIdx];
  if(!poi.lng || !poi.lat) return;

  // Highlight card
  document.querySelectorAll('.timeline-card').forEach(function(c){ c.classList.remove('active') });
  var targetCard = document.querySelector('.timeline-card[data-day="'+dayNum+'"][data-poi-idx="'+poiIdx+'"]');
  if(targetCard){ targetCard.classList.add('active'); targetCard.scrollIntoView({behavior:'smooth',block:'center'}) }

  // Map fly-to
  if(mapInstance && window.TMap){
    try{
      mapInstance.panTo(new TMap.LatLng(poi.lat, poi.lng), {duration:800});
      // Open info window
      openPoiInfoWindow(poi);
    }catch(e){ console.error('Map flyTo error:', e) }
  }
}

function openPoiInfoWindow(poi){
  if(!infoWindow || !window.TMap) return;
  var color = getPOIColor(poi.type);
  var content = '<div style="padding:10px 14px;min-width:150px;font-size:12px;color:#e0e0e0;background:#1a1e2c;border-radius:6px;font-family:system-ui,sans-serif;border:1px solid '+color+'">'
    +'<div style="font-weight:600;font-size:13px;margin-bottom:3px;color:#fff">'+poi.name+'</div>'
    +'<div style="color:'+color+';font-size:11px;margin-bottom:2px">'+getPOILabel(poi.type)+' · '+poi.time+'</div>'
    +(poi.desc?'<div style="color:#a0a8b8;font-size:11px">'+poi.desc+'</div>':'')
    +'</div>';
  infoWindow.setContent(content);
  infoWindow.setPosition(new TMap.LatLng(poi.lat, poi.lng));
  infoWindow.open();
}

/* ================================================================
   Switch Day
   ================================================================ */
function switchDay(dayNum){
  currentDay = dayNum;
  renderDayTabs(dayNum);
  var dayIdx = tripData.days.findIndex(function(d){ return d.day===dayNum });
  if(dayIdx<0) dayIdx=0;
  renderTimeline(dayIdx);
  renderMapMarkers(dayIdx);
}

/* ================================================================
   Draw Map Markers & Polylines for a specific day
   ================================================================ */
function buildMarkerSvg(color, num){
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="34" viewBox="0 0 22 34">'
    +'<path d="M11 0C4.9 0 0 4.9 0 11c0 8.3 11 23 11 23s11-14.7 11-23C22 4.9 17.1 0 11 0z" fill="'+color+'" stroke="#fff" stroke-width="1.5"/>'
    +'<circle cx="11" cy="11" r="5" fill="#fff"/>'
    +'<text x="11" y="13.5" text-anchor="middle" font-size="7" font-weight="bold" fill="'+color+'">'+num+'</text>'
    +'</svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function renderMapMarkers(dayIdx){
  if(!mapInstance || !window.TMap) return;
  var dayData = tripData.days[dayIdx];
  if(!dayData) return;

  // Clean up old layers
  if(markerLayer){ markerLayer.setMap(null); markerLayer=null; }
  if(polylineLayer){ polylineLayer.setMap(null); polylineLayer=null; }

  // Filter valid POIs
  var valid = [];
  dayData.pois.forEach(function(p){ if(p.lng&&p.lat) valid.push(p) });
  if(valid.length===0) return;

  // Build marker geometries
  var markerGeos = [];
  valid.forEach(function(poi, idx){
    var color = getPOIColor(poi.type);
    markerGeos.push({
      id: 'poi-'+idx,
      styleId: 'style-'+idx,
      position: new TMap.LatLng(poi.lat, poi.lng),
      properties: { title: poi.name, type: poi.type, time: poi.time, desc: poi.desc, color: color }
    });
  });

  // Build marker styles
  var markerStyles = {};
  valid.forEach(function(poi, idx){
    var color = getPOIColor(poi.type);
    markerStyles['style-'+idx] = {
      width: 22, height: 34,
      anchor: { x: 11, y: 34 },
      src: buildMarkerSvg(color, idx+1)
    };
  });

  markerLayer = new TMap.MultiMarker({
    map: mapInstance,
    styles: markerStyles,
    geometries: markerGeos
  });

  // Marker click
  markerLayer.on('click', function(evt){
    var geom = evt.geometry;
    if(!geom || !infoWindow) return;
    var p = geom.properties;
    var content = '<div style="padding:10px 14px;min-width:150px;font-size:12px;color:#e0e0e0;background:#1a1e2c;border-radius:6px;font-family:system-ui,sans-serif;border:1px solid '+p.color+'">'
      +'<div style="font-weight:600;font-size:13px;margin-bottom:3px;color:#fff">'+p.title+'</div>'
      +'<div style="color:'+p.color+';font-size:11px;margin-bottom:2px">'+getPOILabel(p.type)+' · '+p.time+'</div>'
      +(p.desc?'<div style="color:#a0a8b8;font-size:11px">'+p.desc+'</div>':'')
      +'</div>';
    infoWindow.setContent(content);
    infoWindow.setPosition(geom.position);
    infoWindow.open();

    // Also highlight card
    document.querySelectorAll('.timeline-card').forEach(function(c){ c.classList.remove('active') });
    var poiIdx = parseInt(geom.id.replace('poi-',''));
    var card = document.querySelector('.timeline-card[data-poi-idx="'+poiIdx+'"]');
    if(card){ card.classList.add('active'); card.scrollIntoView({behavior:'smooth',block:'center'}) }
  });

  // Build polyline
  if(valid.length>=2){
    var path = valid.map(function(p){ return new TMap.LatLng(p.lat, p.lng) });
    polylineLayer = new TMap.MultiPolyline({
      map: mapInstance,
      styles: { 'default': { color: '#85B7EB', width: 3, borderWidth: 0, lineCap: 'round', lineJoin: 'round', dashArray: [10,6] } },
      geometries: [{ id: 'line', styleId: 'default', paths: path }]
    });
  }

  // Fit bounds
  fitBoundsToDay(dayData);
}

function fitBoundsToDay(dayData){
  if(!mapInstance || !window.TMap) return;
  var valid = dayData.pois.filter(function(p){ return p.lng&&p.lat });
  if(valid.length===0) return;
  var latLngs = valid.map(function(p){ return new TMap.LatLng(p.lat, p.lng) });
  var sw = new TMap.LatLng(
    Math.min.apply(null, latLngs.map(function(ll){return ll.getLat()})),
    Math.min.apply(null, latLngs.map(function(ll){return ll.getLng()}))
  );
  var ne = new TMap.LatLng(
    Math.max.apply(null, latLngs.map(function(ll){return ll.getLat()})),
    Math.max.apply(null, latLngs.map(function(ll){return ll.getLng()}))
  );
  try{
    mapInstance.fitBounds(new TMap.LatLngBounds(sw, ne), { padding: 50 });
  }catch(e){ /* fallback */ }
}

/* ================================================================
   Initialize Map
   ================================================================ */
function initMap(){
  loadTencentMap().then(function(TMap){
    var container = document.getElementById('mapContainer');
    var center = tripData.center || { lng: 112.549, lat: 37.857 };

    mapInstance = new TMap.Map(container, {
      center: new TMap.LatLng(center.lat, center.lng),
      zoom: 7,
      pitch: 0,
      mapStyleId: 'style1'
    });

    infoWindow = new TMap.InfoWindow({
      map: mapInstance,
      position: new TMap.LatLng(center.lat, center.lng),
      offset: { x: 0, y: -40 },
      content: '',
      enableCustom: true
    });
    infoWindow.close();

    document.getElementById('mapLoading').style.display = 'none';

    // Render day 1
    renderMapMarkers(0);
  }).catch(function(err){
    console.error('Map load error:', err);
    document.getElementById('mapLoading').innerHTML = '<div class="text" style="color:#F09595">地图加载失败，请检查网络后刷新</div>';
  });
}

/* ================================================================
   Config Panel
   ================================================================ */
document.getElementById('configToggle').addEventListener('click',function(){
  document.getElementById('configOverlay').classList.add('open');
});
function closeConfig(){
  document.getElementById('configOverlay').classList.remove('open');
}
document.getElementById('configOverlay').addEventListener('click',function(e){
  if(e.target===this) closeConfig();
});

function applyConfig(){
  tripData.title = document.getElementById('cfgTitle').value || tripData.title;
  tripData.subtitle = document.getElementById('cfgSub').value || tripData.subtitle;
  tripData.totalBudget = document.getElementById('cfgBudget').value || tripData.totalBudget;
  tripData.transport = document.getElementById('cfgTransport').value || tripData.transport;

  // Update banners
  document.getElementById('bannerTitle').innerHTML = tripData.title+' <span>'+(tripData.titleAccent||'')+'</span>';
  document.getElementById('bannerSub').textContent = tripData.subtitle;
  document.getElementById('badgeDays').textContent = tripData.totalDays;
  document.getElementById('badgeBudget').textContent = tripData.totalBudget;
  document.getElementById('badgeTransport').textContent = tripData.transport;
  closeConfig();
}

/* ================================================================
   Initialize
   ================================================================ */
(function(){
  // Render UI
  document.getElementById('badgeDays').textContent = tripData.totalDays;
  document.getElementById('badgePOIs').textContent = tripData.totalPOIs;
  document.getElementById('badgeBudget').textContent = tripData.totalBudget;
  document.getElementById('badgeTransport').textContent = tripData.transport;
  document.getElementById('bannerSub').textContent = tripData.subtitle;

  renderDayTabs(currentDay);
  renderTimeline(0);
  initMap();
})();
</script>
