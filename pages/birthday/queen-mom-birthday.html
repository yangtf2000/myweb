  /* 露珠 */
  .dew-layer{ position:absolute; inset:0; z-index:1; pointer-events:none; }
  .dew{ position:absolute; border-radius:50%;
    background:radial-gradient(circle at 25% 22%, rgba(255,255,255,0.98), rgba(255,255,255,0.35) 35%, transparent 72%);
    box-shadow:0 0 5px rgba(255,255,255,.55), inset -1px -1px 2px rgba(255,255,255,.4);
    animation:dewTwinkle 2.4s ease-in-out infinite; opacity:.75; }
  @keyframes dewTwinkle{ 0%,100%{opacity:.45; transform:scale(1)} 50%{opacity:1; transform:scale(1.35)} }

  /* 暗角/柔光遮罩 */
  .overlay{ position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(45% 35% at 50% 28%, rgba(255,255,255,.28), transparent 70%),
      radial-gradient(75% 70% at 50% 55%, transparent 30%, rgba(50,25,15,.45) 100%); }

  canvas#fx{ position:fixed; inset:0; z-index:2; pointer-events:none; touch-action:none; }

  .stage{ position:relative; z-index:5; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:space-between; padding:24px 14px 26px; }

  .top{ width:100%; text-align:center; }
  .to{ font-family:var(--serif); font-size:clamp(30px,8.4vw,52px); font-weight:900; letter-spacing:4px;
    color:#fff; text-shadow:0 2px 10px rgba(60,30,15,.45); padding:0 8px; }
  .to .ph{ color:rgba(255,255,255,.82); font-weight:500; }
  .greet{ margin-top:16px; min-height:64px; font-family:var(--serif); font-size:clamp(16px,4vw,22px);
    color:#fff; max-width:min(520px, calc(100vw - 36px)); margin-left:auto; margin-right:auto; line-height:2;
    padding:0 10px; text-shadow:0 2px 10px rgba(60,30,15,.55); font-style:italic; font-weight:700;
    white-space:pre-line; letter-spacing:.5px; }

  .love-wrap{ position:fixed; left:50%; bottom:38px; transform:translateX(-50%); width:min(540px,90%); z-index:6; }
  .love-label{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:rgba(255,255,255,.85); margin-bottom:7px; text-shadow:0 1px 4px rgba(0,0,0,.3); }
  .love-label span{ font-family:var(--serif); letter-spacing:2px; }
  .love-label .combo{ color:#fff7d6; font-weight:700; opacity:.95; transition:.2s; font-family:var(--serif); text-shadow:0 0 8px rgba(255,215,120,.6); }
  .love-label .combo b{ color:#fff; font-weight:900; font-size:1.15em; }
  .love-label .combo.pop{ transform:scale(1.18); color:#fff; }
  .bar{ height:15px; border-radius:99px; background:rgba(255,255,255,.35); overflow:hidden;
    border:1px solid rgba(255,255,255,.45); box-shadow:inset 0 1px 4px rgba(0,0,0,.15), 0 4px 14px rgba(0,0,0,.2); }
  .bar > i{ display:block; height:100%; width:0%;
    background:linear-gradient(90deg,var(--accent),#fff5c2,var(--gold)); transition:width .35s ease;
    box-shadow:0 0 12px rgba(255,215,120,.55); }

  /* 接礼物玩法 */
  .catch-hint{ margin-top:14px; font-family:var(--serif); font-size:14px; color:rgba(255,255,255,.92);
    letter-spacing:1px; text-shadow:0 1px 5px rgba(0,0,0,.4); background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35); border-radius:99px; padding:8px 18px; backdrop-filter:blur(6px);
    display:inline-flex; align-items:center; gap:6px; animation:hintPulse 2.4s ease-in-out infinite; }
  @keyframes hintPulse{ 0%,100%{opacity:.82} 50%{opacity:1} }
  .catch-hint.gone{ display:none; }

  /* 底部双手 */
  .hands{ position:fixed; bottom:80px; left:50%; z-index:6; font-size:64px; line-height:1;
    transform:translate(-50%,0); pointer-events:none; will-change:left,transform;
    filter:drop-shadow(0 6px 10px rgba(60,30,15,.4)); transition:transform .08s; user-select:none; }
  .hands.catch{ animation:handBounce .28s ease; }

<script>
(function(){
  "use strict";

  /* ---------- 色系 ---------- */
  const PALETTES = {
    pink:    { name:'少女粉', accent:'#d98aae', gold:'#e6b15a', ink:'#7a4a5e', soft:'#b07a90' },
    gold:    { name:'香槟金', accent:'#c79a4e', gold:'#c79a4e', ink:'#5a4632', soft:'#9a8160' },
    purple:  { name:'梦幻紫', accent:'#9a7fd8', gold:'#c9a6e8', ink:'#4f3d72', soft:'#8a73b0' },
    blue:    { name:'海洋蓝', accent:'#4f9fd0', gold:'#9fdcff', ink:'#2f5a72', soft:'#5b93ad' },
    green:   { name:'森系绿', accent:'#4f9f74', gold:'#bfe6a8', ink:'#2f5e44', soft:'#5b9c7a' },
    darkgold:{ name:'夜金',   accent:'#e9c46a', gold:'#e9c46a', ink:'#fbf1df', soft:'#d8c4a0' },
  };

  /* ---------- 游戏页温情话(22 条,15 秒切一条;一起不署名,单人署名——老大 / ——老二) ---------- */
  const GAMETALK = [
    // 一起 —— 不署名
    '妈妈,谢谢您把我们拉扯大,把省下来的钱都打扮了我们俩,自己一件新衣服却舍不得买。',
    '您打我们下手最重,抱我们搂得最紧。谢谢您这样用力地爱我们,妈,生日快乐。',
    '您说"等你长大了",现在我们长大了,换我们来护着您。今天您只管当寿星。',
    '您永远是家里最晚睡、最早起的那个人。妈,歇歇吧,日子有我们扛。',
    '妈妈,您笑起来最好看,所以您多笑,我们哥俩就天天都有糖吃。',
    '一把屎一把尿把我们喂大,这话您说得轻巧,我们听得眼泪汪汪。妈,这辈子能当您儿子,是我们修来的福。',
    '谢谢您把日子过得热气腾腾。一家人围在桌前,有您就有家,妈,生日快乐。',
    // 彩虹屁 / 诙谐 —— 一起
    '妈,您是我认识的最美的人,温柔、能干、还会挑衣服——别问随谁,反正随您。',
    '妈妈,您一笑春风都自愧不如,您一开口连家里的花都忍不住鼓掌。',
    '妈妈,您这一身本事,搁在宫斗剧里至少活到大结局——我们就是您的铁粉。',
    '妈,您是光发钱、不做事那种老板,以前给我们发压岁钱从不手软——今天该我们给您发。',
    // 吐槽劝和 —— 一起
    '妈妈,下次追着骂我们之前先深呼吸三口。您伤感,我们伤心,全家和和气气,大家都有糖吃。',
    '您骂我们半小时不带喘气,体力堪比马拉松选手。妈,您这功夫不报个奥运可惜了——但别在家用。',
    // 煽情落泪 —— 一起
    '您从没缺席我们的成长,我们也不想错过您变老的每一刻。妈,以后换我们陪您慢慢走。',
    '我们从小到大,您最常对我们说的是"没事,有妈在"。妈,以后轮到我们说这句了。',
    // 老大个人 —— 18 岁,今年要上大学
    '—— 老大:妈,我马上要上大学了,以后不在您身边的日子,您要好好吃饭、好好睡觉。儿子不在,牵挂一直在。',
    '—— 老大:谢谢您供我读到大学,没让我因为钱发过一次愁。您放心,等我毕业,第一份工资给妈妈买金项链。',
    '—— 老大:以前您牵着我上学,现在换我隔三差五给您打电话。您要嫌我烦,我也认了。',
    '—— 老大:妈,弟弟在家不听话,您打他悠着点——毕竟家里就这一个能挨打的(坏笑)。',
    // 老二个人 —— 10 岁,被追着亲又被嫌弃、被骂减肥
    '—— 老二:妈妈,别老追着让我减肥了,瘦下来您又该说我没小时候可爱。我就是个圆润的快乐胖子,谢谢。',
    '—— 老二:妈妈,您几小时不见就追着亲,亲完又嫌弃我黏人。您这又爱又嫌的,我也挺为难的。',
    '—— 老二:哥哥上大学去了,家里就剩我一个挨骂的。您要气没处撒,就骂我两下,但别太狠,我还是您最亲的小棉袄。',
  ];
  function getTalk(advance){
    const t = GAMETALK[state.talkIdx % GAMETALK.length];
    if(advance) state.talkIdx++;
    return t;
  }
  function genBody(){
    const who=(state.name&&state.name.trim())? state.name.trim() : '妈妈';
    let body;
    if(state.self && state.self.trim()) body=state.self.trim();
    else body=getTalk(false);
    return {who, body};
  }

  /* ---------- 短祝福（接到礼物时飘出） ---------- */
  const BLESS = [
    '生日快乐 🎉','越来越美 🌸','心想事成 ✨','健康平安 🍀','天天开心 😊',
    '万事顺意 🎊','青春永驻 💖','好运连连 🍾','被爱包围 💐','笑口常开 😄',
    '岁岁平安 🌷','财源滚滚 💰','甜蜜满满 🍰','光芒万丈 🌟','幸福常伴 🕊️',
    '如花似玉 🌺','事事如意 🎈','喜乐无忧 🎂','温柔以待 🎀','梦想成真 🌈'
  ];

  /* ---------- 状态 ---------- */
  const state = { name:'', pal:'gold', love:0, caught:0, blessIdx:0, talkIdx:0,
    handsX:0, running:false, finished:false, baseUrl:'', self:'', music:true, talkTimer:null };

  function readHash(){
    const h=location.hash.replace(/^#/,''); if(!h) return null;
    try{ return JSON.parse(decodeURIComponent(escape(atob(h)))); }catch(e){ return null; }
  }
  const hc=readHash(); if(hc){ Object.assign(state, hc); if(hc.pal) state.pal=hc.pal; }

  const $ = s=>document.querySelector(s);
  const body=document.body, toName=$('#toName'), greet=$('#greet'),
        loveBar=$('#loveBar'), comboEl=$('#combo');

  function applyPalette(){
    const p=PALETTES[state.pal];
    const r=document.documentElement.style;
    r.setProperty('--accent',p.accent); r.setProperty('--gold',p.gold);
    r.setProperty('--ink',p.ink); r.setProperty('--soft',p.soft);
  }
  function renderGreeting(){
    const who=(state.name&&state.name.trim())? state.name.trim() : null;
    toName.innerHTML = who ? '致 '+escapeHtml(who) : '致 <span class="ph">妈妈</span>';
    greet.textContent = toLines(genBody().body);
  }
  function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function toLines(s){ return s.replace(/[，。,]/g, m=>m+'\n').replace(/\n+$/,''); }

  /* ---------- 露珠 ---------- */
  function makeDew(){
    const dl=$('#dewLayer'); dl.innerHTML='';
    for(let i=0;i<22;i++){
      const d=document.createElement('div'); d.className='dew';
      d.style.left=(4+Math.random()*92)+'%';
      d.style.top=(10+Math.random()*85)+'%';
      const s=3+Math.random()*9; d.style.width=s+'px'; d.style.height=s+'px';
      d.style.animationDelay=(Math.random()*3)+'s';
      d.style.animationDuration=(2+Math.random()*2)+'s';
      dl.appendChild(d);
    }
  }

  /* ---------- 粒子 ---------- */
  const cv=$('#fx'), ctx=cv.getContext('2d');
  let W,H,DPR=1;
  function resize(){ DPR=Math.min(devicePixelRatio||1,1.5); W=innerWidth; H=innerHeight;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0); }
  resize(); addEventListener('resize',resize);
  const parts=[];
  function starPath(x,y,r,rot){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.beginPath();
    for(let i=0;i<5;i++){ const a=i*2*Math.PI/5-Math.PI/2; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      const a2=a+Math.PI/5; ctx.lineTo(Math.cos(a2)*r*0.45,Math.sin(a2)*r*0.45); }
    ctx.closePath(); ctx.restore();
  }
  function spawnStar(){
    const colors=['#fff7d6','#ffdce8','#c9f0ff','#fff','#ffe9a8'];
    parts.push({ type:'star', x:Math.random()*W, y:H+20, vx:(Math.random()-.5)*.6,
      vy:-(1.0+Math.random()*1.6), rot:Math.random()*6, vr:(Math.random()-.5)*.08,
      r:4+Math.random()*7, color:colors[Math.floor(Math.random()*colors.length)], life:0, max:260+Math.random()*140 });
  }

  function spawnGift(){
    if(!state.running||state.finished) return;
    // 28% 概率掉兄弟头像礼盒(图加载好后才会触发)
    if(Math.random()<0.28 && PHOTO_GIFTS.every(p=>p.img.complete && p.img.naturalWidth>0)){
      const ph=PHOTO_GIFTS[Math.floor(Math.random()*PHOTO_GIFTS.length)];
      parts.push({ type:'gift', isPhoto:true, img:ph.img, name:ph.name,
        x:60+Math.random()*(W-120), y:-80, vx:(Math.random()-.5)*0.7,
        vy:1.4+Math.random()*1.6, rot:(Math.random()-.5)*1.0, vr:(Math.random()-.5)*0.22,
        size:96+Math.random()*28, caught:false });
      return;
    }
    parts.push({ type:'gift', emoji:GIFTS[Math.floor(Math.random()*GIFTS.length)],
      x:60+Math.random()*(W-120), y:-50, vx:(Math.random()-.5)*0.9,
      vy:1.8+Math.random()*2.0, rot:(Math.random()-.5)*1.3, vr:(Math.random()-.5)*0.28,
      size:56+Math.random()*32, caught:false });
  }
  function burst(x,y){
    const colors=['#fff7d6','#ffdce8','#c9f0ff','#fff','#ffe9a8','#ffb7c5','#a8e6cf'];
    for(let i=0;i<30;i++){ const a=Math.random()*Math.PI*2, sp=2+Math.random()*4;
      parts.push({ type:'star', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1, rot:Math.random()*6,
        vr:(Math.random()-.5)*.2, r:5+Math.random()*9, color:colors[Math.floor(Math.random()*colors.length)],
        life:0, max:70+Math.random()*45, grav:.06 }); }
  }
  const catchY = ()=> H-100;  // 双手接取带的高度
  let starTimer=0;
  function loop(){
    const playing = state.running || state.finished;
    ctx.clearRect(0,0,W,H);
    starTimer++;
    // 开场页(未进入游戏)：持续飘升的星星 + 偶发地面彩花,营造热闹氛围；并限制数量保性能
    if(!playing){
      if(starTimer % 7 === 0) spawnStar();
      if(starTimer % 43 === 0) burst(W*(0.15+Math.random()*0.7), H*0.82);
      if(parts.length > 60) parts.splice(0, parts.length-60);
    } else {
      if(starTimer % 9 === 0) spawnStar();
    }
    const cy=catchY();
    for(let i=parts.length-1;i>=0;i--){
      const pt=parts[i]; pt.life++;
      if(pt.type==='star'){
        pt.x+=pt.vx; pt.y+=pt.vy; pt.rot+=pt.vr; if(pt.grav) pt.vy+=pt.grav;
        const t=pt.life/pt.max; ctx.globalAlpha=Math.max(0,1-t);
        ctx.fillStyle=pt.color; starPath(pt.x,pt.y,pt.r,pt.rot); ctx.fill(); ctx.globalAlpha=1;
        if(pt.life>=pt.max||pt.y<-30||pt.y>H+30) parts.splice(i,1);
      } else if(pt.type==='gift'){
        pt.x+=pt.vx; pt.y+=pt.vy; pt.rot+=pt.vr;
        const tol = pt.isPhoto ? Math.max(72, pt.size*0.55) : 72;
        if(playing && !pt.caught && state.running && !state.finished
           && pt.y>=cy-32 && pt.y<=cy+38 && Math.abs(pt.x-state.handsX)<tol){
          pt.caught=true; onCatch(pt.x, cy); parts.splice(i,1); continue;
        }
        ctx.save(); ctx.translate(pt.x,pt.y); ctx.rotate(pt.rot);
        if(pt.isPhoto){
          const w=pt.size, h=pt.size;
          ctx.drawImage(pt.img, -w/2, -h/2, w, h);
        } else {
          ctx.font=pt.size+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(pt.emoji,0,0);
        }
        ctx.restore();
        if(pt.y>H+44) parts.splice(i,1);
      } else {
        pt.x+=pt.vx; pt.y+=pt.vy; pt.rot+=pt.vr;
        ctx.save(); ctx.translate(pt.x,pt.y); ctx.rotate(pt.rot);
        ctx.globalAlpha=pt.life>pt.max-40?Math.max(0,(pt.max-pt.life)/40):1;
        ctx.font=pt.size+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(pt.emoji,0,0); ctx.restore(); ctx.globalAlpha=1;
        if(pt.life>=pt.max||pt.y>H+40) parts.splice(i,1);
      }
    }
    requestAnimationFrame(loop);
  }
  loop();

  /* ---------- 接礼物互动 ---------- */
  const handsEl=$('#hands'), caughtNum=$('#caughtNum'),
        catchHint=$('#catchHint'), milestoneEl=$('#milestone');

  function setHands(clientX){
    state.handsX=Math.max(30, Math.min(W-30, clientX));
    handsEl.style.left=state.handsX+'px';
  }
  setHands(innerWidth/2);
  addEventListener('mousemove', e=>{ if(state.running) setHands(e.clientX); });
  function onTouch(e){ if(state.running && e.touches[0]){ setHands(e.touches[0].clientX); e.preventDefault(); } }
  addEventListener('touchmove', onTouch, {passive:false});
  addEventListener('touchstart', onTouch, {passive:false});
  addEventListener('resize', ()=>setHands(state.handsX||innerWidth/2));

  function floatBless(text,x,y){
    const el=document.createElement('div'); el.className='float-bless'; el.textContent=text;
    const dx=Math.random()*120-60, rot=Math.random()*24-12, size=16+Math.random()*12, dur=1400+Math.random()*900;
    const cols=[PALETTES[state.pal].gold,'#fff7d6','#ffdce8','#c9f0ff','#ffb7c5','#a8e6cf','#ffe9a8'];
    el.style.left=(x+dx)+'px'; el.style.top=y+'px';
    el.style.color=cols[Math.floor(Math.random()*cols.length)];
    el.style.fontSize=size+'px';
    el.style.transition='transform '+dur+'ms ease-out, opacity '+dur+'ms ease-out';
    el.style.opacity='1';
    document.body.appendChild(el);
    requestAnimationFrame(()=>{ el.style.transform='translate(-50%,-185px) rotate('+rot+'deg)'; el.style.opacity='0'; });
    setTimeout(()=>el.remove(),dur+60);
  }
  function milestone(text){
    milestoneEl.textContent=text; milestoneEl.classList.remove('show'); void milestoneEl.offsetWidth;
    milestoneEl.classList.add('show');
  }

  function onCatch(x,y){
    if(typeof playCatch==='function') playCatch();
    state.caught++; caughtNum.textContent=state.caught;
    const c=comboEl; c.classList.add('pop'); clearTimeout(c._t); c._t=setTimeout(()=>c.classList.remove('pop'),200);
    burst(x,y);
    handsEl.classList.remove('catch'); void handsEl.offsetWidth; handsEl.classList.add('catch');
    // 接得越多，祝福越多
    const msg=BLESS[state.blessIdx % BLESS.length]; state.blessIdx++;
    floatBless(msg, x, y-24);
    // 文案切换交给 startGame 中的 15 秒定时器,这里不再按接礼数硬切
    if(state.caught===10) milestone('已收获 10 份祝福 🎉');
    else if(state.caught===20) milestone('满满都是爱 💖');
    else if(state.caught>0 && state.caught%30===0) milestone(state.caught+' 份祝福 · 太棒啦 🎊');
    state.love=Math.min(100, state.love+4); loveBar.style.width=state.love+'%';
    if(state.love>=100 && !state.finished) finale();
  }

  let giftTimer=null;
  function activeGifts(){ let n=0; for(let i=0;i<parts.length;i++) if(parts[i].type==='gift') n++; return n; }
  function scheduleGift(){
    if(!state.running||state.finished) return;
    const c=state.caught;
    const interval = c<6?1200 : c<14?900 : c<26?660 : 470;   // 越接越多，先稀后密
    const maxOn = c<10?3 : c<22?5 : 7;
    giftTimer=setTimeout(()=>{
      if(!state.running||state.finished) return;
      if(activeGifts()<maxOn) spawnGift();
      scheduleGift();
    }, interval);
  }
  function startGame(){
    document.body.classList.add('playing'); state.finished=false; state.running=true;
    // 进入游戏立即切到 GAMETALK 第一句(不与第一页 OPENS 传导),并清掉自带文案
    state.self=''; state.talkIdx=0;
    greet.textContent=toLines(genBody().body);
    // 每 15 秒自动切换一条 GAMETALK
    if(state.talkTimer){ clearInterval(state.talkTimer); state.talkTimer=null; }
    state.talkTimer=setInterval(()=>{
      if(!state.running||state.finished) return;
      state.talkIdx++; greet.textContent=toLines(genBody().body);
    },10000);
    if(catchHint){ catchHint.classList.remove('gone'); setTimeout(()=>catchHint.classList.add('gone'),5000); }
    if(giftTimer) clearTimeout(giftTimer);
    giftTimer=setTimeout(scheduleGift, 650);
  }
  function stopGame(){ state.running=false; if(giftTimer){ clearTimeout(giftTimer); giftTimer=null; } if(state.talkTimer){ clearInterval(state.talkTimer); state.talkTimer=null; } }

  function finale(){
    state.finished=true; stopGame();
    for(let i=parts.length-1;i>=0;i--){ if(parts[i].type==='gift') parts.splice(i,1); }
    let n=0; const iv=setInterval(()=>{ burst(W/2+(Math.random()-.5)*W*.6, H*.4+Math.random()*H*.2);
      if(++n>22) clearInterval(iv); },90);
    const fe=$('#finale'); fe.classList.add('show');
    setTimeout(()=>{ fe.classList.remove('show'); restartGame(); }, 4000);
  }
  function restartGame(){
    state.love=0; state.caught=0; state.blessIdx=0; state.talkIdx=0; state.finished=false;
    if(typeof caughtNum!=='undefined'&&caughtNum) caughtNum.textContent='0';
    if(typeof loveBar!=='undefined'&&loveBar) loveBar.style.width='0%';
    if(state.talkTimer){ clearInterval(state.talkTimer); state.talkTimer=null; }
    startGame();
  }
  /* ---------- 3D 贺卡已移除，蛋糕后直接 restartGame() ---------- */

  /* ---------- 喜庆音乐（Web Audio） ---------- */
  let audioCtx, gainNode, musicTimer;
  const MELODY = [
    {f:392,d:0.24},{f:392,d:0.24},{f:440,d:0.48},{f:392,d:0.48},{f:523,d:0.48},{f:494,d:0.96},
    {f:392,d:0.24},{f:392,d:0.24},{f:440,d:0.48},{f:392,d:0.48},{f:587,d:0.48},{f:523,d:0.96},
    {f:392,d:0.24},{f:392,d:0.24},{f:784,d:0.48},{f:659,d:0.48},{f:523,d:0.48},{f:494,d:0.48},{f:440,d:0.96},
    {f:698,d:0.24},{f:698,d:0.24},{f:659,d:0.48},{f:523,d:0.48},{f:587,d:0.48},{f:523,d:0.96},
    {f:0,d:0.4}
  ];
  /* 背景音乐已移除(Round 25)：仅保留接礼物 / 进场音效，去掉断断续续的 MP3 */
  let bgm=null;
  let loopStarted=false;
  function initAudio(){
    if(audioCtx) return;
    try{
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      gainNode=audioCtx.createGain();
      gainNode.connect(audioCtx.destination);
      gainNode.gain.value=0.32;
    }catch(e){ console.log('audio not supported'); return; }
  }
  function startWhenReady(){
    if(!audioCtx) return;
    if(audioCtx.state==='running'){ if(!loopStarted){ loopStarted=true; scheduleLoop(); } return; }
    const go=()=>{
      try{
        audioCtx.resume().then(()=>{ if(!loopStarted){ loopStarted=true; scheduleLoop(); } }).catch(()=>{});
      }catch(e){}
      // 立即尝试再起一次,部分浏览器(尤其 WeChat)需要同步调用
      if(audioCtx.state!=='running' && !loopStarted){
        setTimeout(()=>{ if(audioCtx.state==='running' && !loopStarted){ loopStarted=true; scheduleLoop(); } }, 60);
      }
    };
    document.addEventListener('pointerdown',go,{once:true});
    document.addEventListener('touchstart',go,{once:true});
    document.addEventListener('click',go,{once:true});
    document.addEventListener('keydown',go,{once:true});
    // 兜底:3 秒后仍未启动,尝试再 resume 一次(适用于 WeChat 二次解锁)
    setTimeout(()=>{ if(audioCtx && audioCtx.state!=='running'){ try{ audioCtx.resume(); }catch(e){} } }, 3000);
  }
  function playTone(freq, when, dur){
    if(!freq) return;
    const osc=audioCtx.createOscillator(), env=audioCtx.createGain();
    osc.type='sine'; osc.frequency.value=freq;
    env.gain.setValueAtTime(0, when);
    env.gain.linearRampToValueAtTime(0.22, when+0.04);
    env.gain.exponentialRampToValueAtTime(0.001, when+dur);
    osc.connect(env); env.connect(gainNode);
    osc.start(when); osc.stop(when+dur+0.08);
  }
  function playHarmony(freq, when, dur){
    if(!freq) return;
    const osc=audioCtx.createOscillator(), env=audioCtx.createGain();
    osc.type='triangle'; osc.frequency.value=freq;
    env.gain.setValueAtTime(0, when);
    env.gain.linearRampToValueAtTime(0.11, when+0.05);
    env.gain.exponentialRampToValueAtTime(0.001, when+dur*1.5);
    osc.connect(env); env.connect(gainNode);
    osc.start(when); osc.stop(when+dur+0.1);
  }
  let nextNoteTime=0;
  function scheduleLoop(){
    if(!audioCtx) return;
    const now=audioCtx.currentTime;
    nextNoteTime=Math.max(nextNoteTime, now+0.02);
    let loopStart=nextNoteTime;
    MELODY.forEach(n=>{
      if(n.f){ playTone(n.f, nextNoteTime, n.d); playHarmony(n.f*0.62, nextNoteTime, n.d); }
      nextNoteTime += n.d + 0.08;
    });
    const wait=(nextNoteTime-now)*1000;
    musicTimer=setTimeout(scheduleLoop, wait-120);
  }
  /* 音乐控制按钮已移除：打开即自动播放《生日快乐》 */
  /* 音乐控制按钮已移除 */

  /* ---------- 设置面板 ---------- */
  function buildControls(){
    const pr=$('#paletteRow'); pr.innerHTML='';
    Object.keys(PALETTES).forEach(k=>{
      const p=PALETTES[k]; const d=document.createElement('div');
      d.className='swatch'+(k===state.pal?' on':''); d.title=p.name;
      d.style.background=`linear-gradient(135deg,${p.accent},${p.gold})`;
      d.addEventListener('click',()=>{ state.pal=k; applyPalette();
        pr.querySelectorAll('.swatch').forEach(s=>s.classList.remove('on')); d.classList.add('on'); });
      pr.appendChild(d);
    });
  }
  $('#gear').addEventListener('click',()=>$('#panel').classList.add('show'));
  $('#done').addEventListener('click',()=>$('#panel').classList.remove('show'));
  $('#inName').addEventListener('input',e=>{ state.name=e.target.value; renderGreeting(); });
  $('#inBase').addEventListener('input',e=>{ state.baseUrl=e.target.value.trim(); });

  /* ---------- 复制发送链接 ---------- */
  function buildHash(){
    const cfg={ name:state.name, pal:state.pal, baseUrl:state.baseUrl, music:state.music };
    return btoa(unescape(encodeURIComponent(JSON.stringify(cfg)))).replace(/=+$/,'');
  }
  function shareLink(){
    const base=(state.baseUrl && /^https?:\/\//i.test(state.baseUrl))? state.baseUrl.replace(/\/+$/,'') : location.href.split('#')[0];
    const url=base+'#'+buildHash();
    const box=$('#linkbox'); box.classList.add('show'); $('#linkInput').value=url;
    renderQR(url);
    copyText(url);
    toast('已生成发送链接并复制 🔗 直接粘贴发给 TA 即可');
  }
  function copyText(t){
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t)); }
    else fallbackCopy(t);
  }
  function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove(); }
  function renderQR(text){ const box=$('#qr'); box.innerHTML=''; try{ new QRCode(box,{text:text,width:150,height:150,colorDark:'#5a4632',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }catch(e){ box.innerHTML='<span style="font-size:12px;color:#7a4a5e">二维码生成失败</span>'; } }
  $('#send').addEventListener('click',shareLink);
  $('#copyLink').addEventListener('click',()=>{ copyText($('#linkInput').value); toast('已复制 ✅'); });
  $('#qrSave').addEventListener('click',()=>{ const c=$('#qr').querySelector('canvas'); if(!c){ toast('请先生成链接'); return; } const a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download='生日贺卡二维码.png'; a.click(); toast('二维码已保存 💾'); });

  /* ---------- 随机开场 ---------- */
  const OPENS=[
    ()=>`<h1>妈 妈</h1><h1>生 日 快 乐</h1><p class="open-bless">亲爱的妈妈：今天是属于您的日子。这么多年，您起早贪黑、省吃俭用，把我们兄弟俩一点点带大，从没听您喊过一声苦。儿子们不会说漂亮话，只愿您往后的岁月少些操劳、多些欢喜；身体康健，事事顺心。妈妈，生日快乐，我们永远爱您。</p>`,
    ()=>`<h1>妈 妈</h1><h1>生 日 快 乐</h1><p class="open-bless">亲爱的妈妈：今天是属于您的日子。这么多年，您起早贪黑、省吃俭用，把我们兄弟俩一点点带大，从没听您喊过一声苦。儿子们不会说漂亮话，只愿您往后的岁月少些操劳、多些欢喜；身体康健，事事顺心。妈妈，生日快乐，我们永远爱您。</p>`,
    ()=>`<h1>妈 妈</h1><h1>生 日 快 乐</h1><p class="open-bless">亲爱的妈妈：今天是属于您的日子。这么多年，您起早贪黑、省吃俭用，把我们兄弟俩一点点带大，从没听您喊过一声苦。儿子们不会说漂亮话，只愿您往后的岁月少些操劳、多些欢喜；身体康健，事事顺心。妈妈，生日快乐，我们永远爱您。</p>`,
  ];
  /* 进入庆典:全局可调用,微信里用 onclick 属性 / touchstart 兜底都可靠 */
  /* 背景乐:Web Audio 合成《生日快乐》旋律(scheduleLoop),进入网页(首次手势)即起,持续循环到结束 */
  function enterCelebration(){
    if(document.body.classList.contains('playing')) return;   // 防重复进入
    const o=document.getElementById('open'); if(o) o.classList.add('hide');
    document.body.classList.add('playing');
    startGame();
    unlockAudio();   // 进入即起《生日快乐》循环乐
  }
  /* 接住礼物的清脆音效(叮~咚~叮)—— 独立 WebAudio,捕获手势内即时解锁,保证一定有声音 */
  function playCatch(){
    if(!audioCtx){ try{ initAudio(); }catch(e){} }
    if(!audioCtx) return;
    if(audioCtx.state!=='running'){ try{ audioCtx.resume(); }catch(e){} }
    resumeAudioCtx();
    const t=audioCtx.currentTime+0.01;
    [[988,0],[1319,0.07],[1568,0.14]].forEach(function(p){
      const f=p[0], off=p[1];
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, t+off);
      g.gain.linearRampToValueAtTime(0.25, t+off+0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t+off+0.24);
      o.connect(g); g.connect(gainNode);
      o.start(t+off); o.stop(t+off+0.28);
    });
  }
  /* 解锁 WebAudio 并启动《生日快乐》循环背景乐(进入网页即起,持续循环) */
  function unlockAudio(){
    if(!audioCtx){ try{ initAudio(); }catch(e){} }
    resumeAudioCtx();
    startSynthMusic();   // 进入即起生日快乐循环乐(loopStarted 守卫防重复)
  }
  /* 反复 resume 直到 audioCtx 进入 running(覆盖微信/百度首次不生效的内核) */
  function resumeAudioCtx(){
    if(!audioCtx) return;
    try{ audioCtx.resume(); }catch(e){}
    let tries=0;
    const iv=setInterval(function(){
      tries++;
      try{ audioCtx.resume(); }catch(e){}
      if(audioCtx.state==='running'){ clearInterval(iv); }
      else if(tries>=20){ clearInterval(iv); }
    },150);
  }
  /* 合成旋律兜底(真实音频不可用 / 被浏览器拦截时);若真实 MP3 正在播(进度在走)则跳过,避免双声 */
  function startSynthMusic(){
    if(bgm && bgm.currentTime > 0.05 && !bgm.paused) return;  // 真实 MP3 正在播,不叠声
    if(bgm){ try{ bgm.pause(); }catch(e){} }
    if(!audioCtx || loopStarted) return;
    const start=function(){ if(!loopStarted){ loopStarted=true; scheduleLoop(); } };
    if(audioCtx.state==='running'){ start(); return; }
    resumeAudioCtx();
    let tries=0;
    const iv=setInterval(function(){
      tries++;
      if(audioCtx.state==='running'){ start(); clearInterval(iv); }
      else if(tries>=20){ clearInterval(iv); }
    },150);
  }
  window.enterCelebration = enterCelebration;   // 供内联 onclick 调用
  function addEnter(){
    const b=document.createElement('button'); b.className='enter'; b.textContent='进 入 庆 典';
    b.onclick = enterCelebration;
    b.setAttribute('ontouchstart','enterCelebration()');   // 双保险
    $('#open').appendChild(b);
  }
  function openStage(){
    stopGame(); document.body.classList.remove('playing');
    $('#openStage').innerHTML=OPENS[Math.floor(Math.random()*OPENS.length)]();
    $('#open').classList.remove('hide');
    const ex=$('#open .enter'); if(ex) ex.remove();
    addEnter();
  }
  const st=document.createElement('style'); st.textContent='@keyframes crowndrop{to{transform:translateY(0)}}'; document.head.appendChild(st);

  /* ---------- 提示 ---------- */
  function toast(msg){ let t=document.getElementById('toast');
    if(!t){ t=document.createElement('div'); t.id='toast';
      t.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:rgba(40,28,12,.85);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:86%;text-align:center;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:opacity .3s;';
      document.body.appendChild(t); }
    t.textContent=msg; t.style.opacity='1'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity='0',3800); }

  /* ---------- 启动 ---------- */
  makeDew(); applyPalette(); buildControls();
  $('#inName').value=state.name; $('#inBase').value=state.baseUrl;
  renderGreeting(); openStage(); initAudio();
  startSynthMusic();   // 尝试在允许时即起《生日快乐》循环乐(多数浏览器需首个手势才出声)
  /* 微信兜底:开场页任意处 touchstart 即进入;首次手势即起背景乐 */
  (function(){
    const oe=document.getElementById('open');
    const go=function(){ startSynthMusic(); };
    document.addEventListener('pointerdown',go,{once:true});
    document.addEventListener('touchstart',go,{once:true});
    document.addEventListener('click',go,{once:true});
    if(oe){ oe.addEventListener('touchstart', function(){ enterCelebration(); }, {passive:true}); }
  })();
})();
</script>
