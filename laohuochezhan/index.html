<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a0f;color:#e0e0e0;line-height:1.6}
.hero{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)}
.hero::before{content:'';position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=1920') center/cover;opacity:0.3}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,10,15,0.3) 0%,rgba(10,10,15,0.8) 100%)}
.hero-content{position:relative;z-index:2;text-align:center;max-width:900px;padding:0 20px}
.hero-tag{display:inline-block;padding:6px 20px;border:1px solid rgba(233,69,96,0.5);border-radius:20px;color:#e94560;font-size:13px;letter-spacing:2px;margin-bottom:20px}
.hero h1{font-size:48px;font-weight:700;color:#fff;margin-bottom:15px;line-height:1.3}
.hero h1 span{color:#e94560}
.hero p{font-size:18px;color:#aaa;margin-bottom:30px}
.hero-buttons{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 30px;border-radius:6px;font-size:14px;text-decoration:none;transition:all .3s;cursor:pointer;border:none}
.btn-primary{background:#e94560;color:#fff}
.btn-primary:hover{background:#d63850;transform:translateY(-2px)}
.btn-outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.3)}
.btn-outline:hover{border-color:#e94560;color:#e94560}
.container{max-width:1200px;margin:0 auto;padding:30px 20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:30px}
.stat-card{background:#15151f;border-radius:8px;padding:20px;text-align:center;border:1px solid #2a2a3e;transition:all .3s}
.stat-card:hover{border-color:#e94560;transform:translateY(-2px)}
.stat-number{font-size:30px;font-weight:700;color:#e94560;margin-bottom:5px}
.stat-label{font-size:12px;color:#888}
.changelog{background:#15151f;border-radius:8px;padding:20px;margin-bottom:30px;border:1px solid #2a2a3e}
.changelog h3{color:#fff;font-size:18px;margin-bottom:15px;display:flex;align-items:center;gap:10px}
.changelog-item{padding:12px 0;border-bottom:1px solid #222;font-size:13px;color:#aaa}
.changelog-item:last-child{border-bottom:none}
.changelog-item .date{color:#e94560;font-weight:600;margin-right:15px}
.footer{background:#0d0d14;padding:40px 20px;text-align:center;border-top:1px solid #2a2a3e}
.footer p{color:#666;font-size:12px;line-height:2}
@media(max-width:768px){.hero h1{font-size:32px}.hero p{font-size:15px}}
