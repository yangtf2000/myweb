<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老火车站片区资料需求清单</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --card2:#273449;
  --bg2:#1e293b;
  --bg3:#334155;
  --line:#334155;
  --line2:#273449;
  --text:#f1f5f9;
  --text2:#cbd5e1;
  --text3:#94a3b8;
  --rust:#22c55e;
  --rust2:#16a34a;
  --rust-bg:rgba(34,197,94,.15);
  --blue:#4d96ff;
  --green:#22c55e;
  --green-bg:rgba(34,197,94,.15);
  --yellow:#fbbf24;
  --yellow-bg:rgba(251,191,36,.15);
  --red:#ff6b6b;
  --red-bg:rgba(255,107,107,.15);
  --purple:#a78bfa;
  --mono:'JetBrains Mono',monospace;
  --sans:'Noto Sans SC',sans-serif;
  --serif:'Noto Serif SC',serif;
  --maxw:1180px;
  --shadow:0 4px 16px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.2);
  --shadow-hover:0 8px 32px rgba(34,197,94,.2);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;
}
.container{
  max-width:var(--maxw);
  margin:0 auto;
  padding:0 24px;
}
/* ===== 顶部封面 ===== */
.hero{
  border-bottom:1px solid var(--line);
  padding:40px 0 32px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#0f172a 0%,#1a2744 50%,#0f172a 100%);
}
.hero .container{position:relative}
.hero-inner{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:32px 36px;
  box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 0 1px rgba(34,197,94,.1);
}
.hero::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,var(--rust),var(--rust2),transparent);
}
.hero-eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:3px;
  color:var(--rust2);
  text-transform:uppercase;
  margin-bottom:12px;
}
.hero h1{
  font-family:var(--serif);
  font-size:clamp(28px,4vw,42px);
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:8px;
}
.hero-sub{
  color:var(--text2);
  font-size:14px;
  max-width:680px;
}
.hero-meta{
  display:flex;
  gap:32px;
  margin-top:20px;
  flex-wrap:wrap;
}
.hero-meta-item{
  display:flex;
  flex-direction:column;
}
.hero-meta-item .num{
  font-family:var(--mono);
  font-size:28px;
  font-weight:700;
  color:var(--rust2);
}
.hero-meta-item .label{
  font-size:11px;
  color:var(--text3);
  letter-spacing:1px;
}
/* ===== 统计条 ===== */
.stats-bar{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:8px;
  max-width:var(--maxw);
  margin:20px auto 0;
  padding:0 24px;
}
.stat-cell{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:16px 20px;
  box-shadow:var(--shadow);
  transition:all .2s;
}
.stat-cell:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:rgba(34,197,94,.3)}
.stat-cell .val{
  font-family:var(--mono);
  font-size:22px;
  font-weight:700;
}
.stat-cell .lbl{
  font-size:11px;
  color:var(--text3);
  margin-top:2px;
}
.stat-cell.core .val{color:var(--red)}
.stat-cell.done .val{color:var(--green)}
.stat-cell.part .val{color:var(--yellow)}
.stat-cell.miss .val{color:var(--text3)}
.stat-cell.net .val{color:var(--blue)}
/* ===== 筛选栏 ===== */
.toolbar{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(15,23,42,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:10px 0;
  box-shadow:0 2px 12px rgba(0,0,0,.3);
}
.toolbar .container{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}
.toolbar label{
  font-size:11px;
  color:var(--text3);
  font-family:var(--mono);
  letter-spacing:1px;
}
.filter-group{
  display:flex;
  gap:6px;
  align-items:center;
}
.filter-btn{
  background:var(--card);
  border:1px solid var(--line);
  color:var(--text2);
  padding:5px 12px;
  font-size:12px;
  font-family:var(--sans);
  cursor:pointer;
  border-radius:6px;
  transition:all .15s;
}
.filter-btn:hover{border-color:var(--rust);color:var(--rust)}
.filter-btn.active{
  background:rgba(34,197,94,.15);
  border-color:#22c55e;
  color:#22c55e;
  font-weight:600;
}
.search-box{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}
.search-box input{
  background:var(--card);
  border:1px solid var(--line);
  color:var(--text);
  padding:6px 12px;
  font-size:12px;
  font-family:var(--sans);
  width:220px;
  border-radius:6px;
  outline:none;
}
.search-box input:focus{border-color:var(--rust)}
.search-box input::placeholder{color:var(--text3)}
.result-count{
  font-family:var(--mono);
  font-size:11px;
  color:var(--text3);
  min-width:80px;
}
/* ===== 章节 ===== */
.section{
  padding:20px 0;
}
.section-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:24px 28px;
  box-shadow:var(--shadow);
  transition:box-shadow .2s,border-color .2s;
}
.section-card:hover{box-shadow:var(--shadow-hover);border-color:rgba(34,197,94,.3)}
.section-header{
  display:flex;
  align-items:baseline;
  gap:16px;
  margin-bottom:20px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.section-num{
  font-family:var(--mono);
  font-size:36px;
  font-weight:700;
  color:var(--rust);
  opacity:.5;
  line-height:1;
}
.section-title{
  font-family:var(--serif);
  font-size:22px;
  font-weight:700;
}
.section-count{
  font-family:var(--mono);
  font-size:12px;
  color:var(--text3);
  margin-left:auto;
}
/* ===== 子章节 ===== */
.sub-header{
  font-family:var(--mono);
  font-size:13px;
  color:#22c55e;
  padding:10px 0 8px;
  border-left:3px solid #22c55e;
  padding-left:12px;
  margin:16px 0 8px;
  letter-spacing:1px;
  font-weight:600;
  background:linear-gradient(90deg,rgba(34,197,94,.12),transparent);
  border-radius:0 4px 4px 0;
}
/* ===== 表格 ===== */
.table-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--card);
  box-shadow:var(--shadow);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
  table-layout:fixed;
}
thead th{
  background:linear-gradient(180deg,#16a34a 0%,#15803d 100%);
  color:#000000 !important;
  font-weight:700;
  font-size:11px;
  font-family:var(--mono);
  letter-spacing:.5px;
  text-align:left;
  padding:12px 8px;
  border-bottom:2px solid #166534;
  white-space:nowrap;
  position:sticky;
  top:0;
}
thead th.col-id,
thead th.col-name,
thead th.col-imp,
thead th.col-status,
thead th.col-existing,
thead th.col-verify,
thead th.col-need,
thead th.col-source{
  color:#000000 !important;
}
tbody td{
  padding:11px 8px;
  border-bottom:1px solid var(--line2);
  vertical-align:top;
  line-height:1.6;
  background:var(--card);
  word-wrap:break-word;
  word-break:break-word;
  overflow-wrap:break-word;
  color:var(--text2);
}
tbody tr:nth-child(even) td{background:#243044}
tbody tr:hover td{background:rgba(34,197,94,.1)}
tbody tr:last-child td{border-bottom:none}
.col-id{
  font-family:var(--mono);
  font-size:11px;
  color:var(--text3);
  white-space:nowrap;
  width:5%;
}
.col-name{
  font-weight:600;
  width:13%;
  color:var(--text);
}
.col-imp{width:7%;text-align:center}
.col-status{width:7%;text-align:center}
.col-existing{width:25%;color:var(--text2)}
.col-verify{width:13%;color:#fbbf24;font-size:12px}
.col-need{width:22%;color:var(--text)}
.col-source{width:8%;color:var(--text3);font-size:11.5px}
/* 现场调研类6列 */
.field-table .col-id{width:5%}
.field-table .col-name{width:14%}
.field-table .col-imp{width:8%}
.field-table .col-existing{width:19%}
.field-table .col-need{width:40%}
.field-table .col-source{width:14%}
/* 标签 */
.tag{
  display:inline-block;
  padding:2px 8px;
  font-size:10px;
  font-family:var(--mono);
  border-radius:2px;
  letter-spacing:.5px;
  white-space:nowrap;
}
.tag-core{background:rgba(255,107,107,.15);color:#ff6b6b;border:1px solid rgba(255,107,107,.4)}
.tag-important{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.4)}
.tag-general{background:rgba(148,163,184,.15);color:#94a3b8;border:1px solid rgba(148,163,184,.3)}
.tag-done{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.4)}
.tag-part{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.4)}
.tag-miss{background:rgba(255,107,107,.15);color:#ff6b6b;border:1px solid rgba(255,107,107,.4)}
.tag-net{
  background:rgba(77,150,255,.15);
  color:#4d96ff;
  border:1px solid rgba(77,150,255,.4);
  font-size:9px;
  padding:1px 5px;
  margin-left:4px;
  vertical-align:middle;
}
/* 现场调研类表格不同 */
.field-table .col-existing{min-width:180px}
.field-table .col-need{min-width:300px}
/* ===== 底部 ===== */
.footer{
  padding:24px 0 32px;
  text-align:center;
  color:var(--text3);
  font-size:11px;
  font-family:var(--mono);
  letter-spacing:1px;
}
.footer span{color:var(--rust)}
.footer span{color:var(--rust2)}
/* ===== 响应式 ===== */
@media(max-width:768px){
  .container{padding:0 14px}
  .hero{padding:20px 0}
  .hero-inner{padding:20px}
  .hero h1{font-size:22px}
  .hero-sub{font-size:13px}
  .hero-meta{gap:14px}
  .hero-meta-item .num{font-size:20px}
  .section{padding:14px 0}
  .section-card{padding:16px}
  .section-num{font-size:26px}
  .section-title{font-size:17px}
  .section-header{margin-bottom:14px;padding-bottom:10px}
  .toolbar{padding:8px 0}
  .toolbar .container{gap:8px}
  .filter-group{flex-wrap:wrap}
  .filter-btn{padding:4px 10px;font-size:11px}
  .search-box{margin-left:0;width:100%}
  .search-box input{width:100%}
  .stats-bar{grid-template-columns:repeat(2,1fr);gap:6px;padding:0 14px;margin-top:14px}
  .stat-cell{padding:12px 14px}
  .stat-cell .val{font-size:18px}
  table{font-size:11px;table-layout:fixed}
  thead th{padding:7px 5px;font-size:9px;letter-spacing:0}
  tbody td{padding:7px 5px;line-height:1.5}
  .col-name{font-size:11px}
  .col-existing{font-size:11px}
  .col-need{font-size:11px}
  .col-source{font-size:10px}
  .tag{font-size:9px;padding:1px 5px}
  .sub-header{font-size:12px;padding:8px 0 6px 10px;margin:14px 0 6px}
}
/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--rust)}
</style>
</head>

// ===== 渲染 =====
const content = document.getElementById('content');
const resultCount = document.getElementById('resultCount');
const searchInput = document.getElementById('searchInput');

let filters = {cat:'all', imp:'all', status:'all'};
let searchText = '';

function tagImp(v){
  if(v==='core') return '<span class="tag tag-core">核心</span>';
  if(v==='important') return '<span class="tag tag-important">重要</span>';
  if(v==='general') return '<span class="tag tag-general">一般</span>';
  return '';
}
function tagStatus(v){
  if(v==='done') return '<span class="tag tag-done">已有</span>';
  if(v==='part') return '<span class="tag tag-part">部分</span>';
  if(v==='miss') return '<span class="tag tag-miss">缺失</span>';
  return '<span class="tag tag-general">现场</span>';
}

function render(){
  let filtered = DATA.filter(d=>{
    if(filters.cat!=='all' && d.cat!==filters.cat) return false;
    if(filters.imp!=='all' && d.imp!==filters.imp) return false;
    if(filters.status!=='all' && d.status!==filters.status) return false;
    if(searchText){
      const s = searchText.toLowerCase();
      return d.name.toLowerCase().includes(s) || d.existing.toLowerCase().includes(s) || d.need.toLowerCase().includes(s) || d.source.toLowerCase().includes(s);
    }
    return true;
  });

  resultCount.textContent = filtered.length + ' 项';

  if(filtered.length===0){
    content.innerHTML = '<div style="padding:60px;text-align:center;color:var(--text3);font-family:var(--mono)">NO MATCHING ITEMS</div>';
    return;
  }

  // 按类别分组
  const cats = {};
  filtered.forEach(d=>{
    if(!cats[d.cat]) cats[d.cat] = {name:d.catName, subs:{}, items:[]};
    if(d.sub){
      if(!cats[d.cat].subs[d.sub]) cats[d.cat].subs[d.sub]=[];
      cats[d.cat].subs[d.sub].push(d);
    } else {
      cats[d.cat].items.push(d);
    }
  });

  let html = '';
  const catOrder = ['1','2','3','4','5'];
  const catNums = {'1':'01','2':'02','3':'03','4':'04','5':'05'};

  catOrder.forEach(cat=>{
    if(!cats[cat]) return;
    const c = cats[cat];
    const total = filtered.filter(d=>d.cat===cat).length;

    html += `<section class="section" id="cat-${cat}">
      <div class="section-card">
      <div class="section-header">
        <span class="section-num">${catNums[cat]}</span>
        <span class="section-title">${c.name}</span>
        <span class="section-count">${total} 项</span>
      </div>`;

    // 无子类的直接出表
    if(c.items.length>0){
      html += renderTable(c.items, cat==='5');
    }

    // 有子类的
    Object.keys(c.subs).forEach(sub=>{
      html += `<div class="sub-header">${sub}</div>`;
      html += renderTable(c.subs[sub], false);
    });

    html += `</div></section>`;
  });

  content.innerHTML = html;
}

function renderTable(items, isField){
  const cls = isField ? 'field-table' : '';
  let h = `<div class="table-wrap ${cls}"><table><thead><tr>
    <th class="col-id">编号</th>
    <th class="col-name">资料项</th>
    <th class="col-imp">重要性</th>`;
  if(!isField) h += `<th class="col-status">状态</th>`;
  h += `<th class="col-existing">已有数据</th>`;
  if(!isField) h += `<th class="col-verify">需核实</th>`;
  h += `<th class="col-need">${isField?'现场核实要点':'需获取数据'}</th>
    <th class="col-source">获取途径</th>
  </tr></thead><tbody>`;

  items.forEach(d=>{
    const netTag = d.hasNet ? '<span class="tag-net">网络</span>' : '';
    h += `<tr>
      <td class="col-id">${d.id}</td>
      <td class="col-name">${d.name}${netTag}</td>
      <td class="col-imp">${tagImp(d.imp)}</td>`;
    if(!isField) h += `<td class="col-status">${tagStatus(d.status)}</td>`;
    h += `<td class="col-existing">${d.existing}</td>`;
    if(!isField) h += `<td class="col-verify">${d.verify==='—'?'<span style="color:var(--text3)">—</span>':d.verify}</td>`;
    h += `<td class="col-need">${d.need}</td>
      <td class="col-source">${d.source}</td>
    </tr>`;
  });

  h += `</tbody></table></div>`;
  return h;
}

// ===== 筛选事件 =====
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const f = btn.dataset.filter;
    const v = btn.dataset.val;
    filters[f] = v;
    document.querySelectorAll(`.filter-btn[data-filter="${f}"]`).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

searchInput.addEventListener('input',e=>{
  searchText = e.target.value.trim();
  render();
});

// 初始渲染
render();
</script>
